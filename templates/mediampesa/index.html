{% extends 'base.html' %}
{% block title %}Support Creator - MediaHub{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h4 mb-1"><i class="fas fa-mobile-alt text-success"></i> Pay with M-Pesa</h2>
          <p class="text-muted mb-4">You'll get a prompt on your phone to enter your M-Pesa PIN.</p>

          {% if errors %}
            <div class="alert alert-danger">
              {% for error in errors %}<div>{{ error }}</div>{% endfor %}
            </div>
          {% endif %}

          <form action="{% url 'mediampesa:stk_push' %}" method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="phone" class="form-label">M-Pesa phone number</label>
              <input class="form-control" type="tel" id="phone" name="phone"
                     placeholder="0712345678" value="{{ form.phone|default:'' }}" required>
            </div>
            <div class="mb-3">
              <label for="amount" class="form-label">Amount (KES)</label>
              <input class="form-control" type="number" id="amount" name="amount"
                     min="1" step="1" value="{{ form.amount|default:'' }}" required>
            </div>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input class="form-control" type="text" id="name" name="name"
                     value="{{ form.name|default:'' }}" required>
            </div>
            <div class="mb-4">
              <label for="email" class="form-label">Email (for your receipt)</label>
              <input class="form-control" type="email" id="email" name="email"
                     value="{{ form.email|default:'' }}" required>
            </div>
            <button class="btn btn-success w-100" type="submit">Pay Now</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
