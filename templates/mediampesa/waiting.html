{% extends 'base.html' %}
{% block title %}Waiting for Payment - MediaHub{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="spinner-border text-success mb-4" style="width: 4rem; height: 4rem;" role="status"></div>
  <h3>Check your phone</h3>
  <p class="text-muted">
    Enter your M-Pesa PIN on the prompt sent to {{ transaction.phone_number }}
    to pay KES {{ transaction.amount }}.
  </p>
  <p id="status-message" class="text-muted small"></p>
</div>

<script>
const statusUrl = "{% url 'mediampesa:check_status' transaction.id %}";
const redirects = {
  Success: "{% url 'mediampesa:payment_success' %}",
  Failed: "{% url 'mediampesa:payment_failed' %}",
  Cancelled: "{% url 'mediampesa:payment_cancelled' %}",
};
const statusMessage = document.getElementById("status-message");
const POLL_INTERVAL = 5000;   // ms
const MAX_WAIT = 2 * 60000;   // STK prompts expire after about a minute
const startedAt = Date.now();

function checkStatus() {
  fetch(statusUrl)
    .then((response) => response.json())
    .then((data) => {
      if (redirects[data.status]) {
        window.location.href = redirects[data.status];
      } else if (Date.now() - startedAt > MAX_WAIT) {
        statusMessage.textContent = "We haven't received a response from M-Pesa yet. If you completed the payment, you'll get an email receipt shortly.";
      } else {
        setTimeout(checkStatus, POLL_INTERVAL);
      }
    })
    .catch(() => {
      statusMessage.textContent = "Having trouble checking the payment status, retrying...";
      setTimeout(checkStatus, POLL_INTERVAL);
    });
}
setTimeout(checkStatus, POLL_INTERVAL);
</script>
{% endblock %}
